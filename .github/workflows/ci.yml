name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghycs/web db:migrate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        # Cuenta de prueba: sin estos secretos, la suite de contrato contra Google se omite.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_TEST_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_TEST_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_TEST_CALENDAR_ID }}
      - run: pnpm build
        # Valores de relleno: el build solo valida el entorno, no consulta Google.
        env:
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          GOOGLE_REFRESH_TOKEN: ci
